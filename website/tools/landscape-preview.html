<nav><strong>SSG · Landscape detail</strong><button id="detail">Grass close-up</button><button id="full">Full model</button><button id="fallback">Mobile render</button><a href="?original">Before</a><a href="landscape-preview.html">After</a><a href="../">Website ↗</a><a id="download" hidden download="streetlight-fallback.webp">Save render</a></nav><div id="status">Loading model…</div>

import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100),pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.85;
const key=new THREE.DirectionalLight(0xffffff,2.1);key.position.set(-6,9,8);scene.add(key);const rim=new THREE.DirectionalLight(0xc9d4ff,1.3);rim.position.set(7,4,-7);scene.add(rim);scene.add(new THREE.HemisphereLight(0xffffff,0x7f8ee8,.55));
const draco=new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/gltf/');const loader=new GLTFLoader().setDRACOLoader(draco);const original=new URLSearchParams(location.search).has('original');
try{const gltf=await loader.loadAsync(original?'backups/ssg-streetlight.original.glb':'../assets/01-hero/model/ssg-streetlight.web.glb?v=landscape-4');const model=gltf.scene;model.rotation.set(22*Math.PI/180,28*Math.PI/180,0);scene.add(model);model.traverse(o=>{if(o.isMesh&&o.material.map)o.material.map.anisotropy=4;});
let full=false;function render(){camera.fov=35;renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.position.set(0,full?2.25:.09,full?10:3.5);camera.lookAt(0,full?2.25:.09,0);camera.updateProjectionMatrix();renderer.render(scene,camera);document.querySelector('#status').textContent=(original?'Original':'Updated')+' · '+renderer.info.render.triangles.toLocaleString()+' triangles · '+renderer.info.render.calls+' draw calls';}document.querySelector('#full').onclick=()=>{full=true;render()};document.querySelector('#detail').onclick=()=>{full=false;render()};document.querySelector('#fallback').onclick=()=>{renderer.setPixelRatio(1);renderer.setSize(800,1375);camera.aspect=800/1375;camera.fov=20;camera.position.set(0,2.3,20);camera.lookAt(0,2.3,0);camera.updateProjectionMatrix();renderer.render(scene,camera);document.querySelector('#status').textContent='Mobile fallback · 800 × 1375 · transparent';const link=document.querySelector('#download');link.href=renderer.domElement.toDataURL('image/webp',.95);link.hidden=false;};window.addEventListener('resize',render);render();}catch(e){document.querySelector('#status').textContent=e.message;console.error(e)}
